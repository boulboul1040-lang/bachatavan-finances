<style>
  @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; }
  /* Palette chaude BachataVan : vin, or, braise, crème. Accent émeraude = couleur Quechimba (pass VIP). */
  :root { --noir: #140A08; --vin: #8E1B2E; --vin-fonce: #4A0C16; --or: #F2B544; --or-clair: #FFE0A3; --creme: #FFF4E6; --emeraude: #5FD3A0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--noir); }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--creme); }
  .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .cam video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  #chaleur { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(900px 700px at 25% 15%, rgba(255,150,60,.6), transparent 70%), radial-gradient(900px 900px at 80% 95%, rgba(142,27,46,.55), transparent 70%); }
  #voile { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(20,10,8,.6) 0%, rgba(20,10,8,0) 22%, rgba(20,10,8,0) 38%, rgba(20,10,8,.35) 70%, rgba(20,10,8,.75) 100%); }
  #fuite { position: absolute; inset: -200px; pointer-events: none; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(600px 900px at 80% 40%, rgba(255,140,50,.95), rgba(255,90,40,.4) 40%, transparent 70%); }

  #logo { position: absolute; top: 300px; left: 0; right: 0; display: flex; justify-content: center; z-index: 20; }
  #logo img { width: 360px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)); }

  .t { position: absolute; left: 120px; right: 192px; text-align: center; z-index: 15; }
  .big { font-family: "Anton", sans-serif; line-height: .95; letter-spacing: 1px; text-shadow: 0 6px 30px rgba(20,10,8,.8); }
  .w { display: inline-block; }
  .or { color: var(--or); }
  .em { color: var(--emeraude); }
  .pill { display: inline-block; font-weight: 900; font-size: 34px; letter-spacing: 4px; color: var(--noir); background: var(--or); padding: 14px 30px; border-radius: 999px; }
  .pill.vert { background: var(--emeraude); }

  #a-tag { top: 760px; }
  #a { top: 830px; font-size: 150px; }
  #b { top: 880px; font-size: 200px; }
  #c { top: 860px; font-size: 120px; }
  #c-pill { top: 1120px; }
  #d-mini { top: 1130px; }
  #d-mini span { font-family: "Anton", sans-serif; font-size: 44px; letter-spacing: 8px; text-shadow: 0 4px 20px rgba(0,0,0,.8); }
  #e { top: 840px; font-size: 128px; }
  #e-pill { top: 1110px; }

  #fin { position: absolute; inset: 0; z-index: 30; }
  #fin-bg { position: absolute; inset: 0; background: radial-gradient(900px 1000px at 50% 45%, rgba(142,27,46,.92), rgba(74,12,22,.95) 70%, rgba(20,10,8,.98)); }
  #fin-halo { position: absolute; left: -100px; right: -100px; top: 470px; height: 420px; background: radial-gradient(ellipse, rgba(242,181,68,.45), rgba(242,181,68,0) 65%); }
  #fin-plaque { position: absolute; left: 140px; top: 560px; width: 800px; }
  #fin-plaque img { width: 800px; display: block; filter: drop-shadow(0 30px 50px rgba(0,0,0,.6)); }
  #fin-titre { position: absolute; top: 770px; left: 0; right: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 96px; line-height: .95; }
  #fin-trajet { position: absolute; top: 980px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 34px; color: var(--or-clair); }
  #fin-prix { position: absolute; top: 1030px; left: 0; right: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 52px; color: var(--creme); }
  #fin-prix em { font-style: normal; color: var(--or); }
  #fin-cta { position: absolute; top: 1115px; left: 0; right: 0; text-align: center; }
  #fin-cta span { display: inline-block; font-weight: 900; font-size: 40px; letter-spacing: 2px; color: var(--vin-fonce); background: var(--or); padding: 20px 42px; border-radius: 999px; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  #fin-slogan { position: absolute; top: 1225px; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 30px; }
  #fin-slogan em { font-style: normal; color: var(--or); }
</style>

  <script>
    const tl = gsap.timeline({ paused: true });
    const S = (sel, from, to, at) => tl.fromTo(sel, from, to, at);
    const blurIn = (sels, at, gap) => sels.forEach((m, i) => S(m, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: .16, ease: "power2.out" }, at + i * gap));

    // 1. Accroche, complète dès l'image 0 : la caméra bouge, le titre reste
    S("#c1", { scale: 1.16 }, { scale: 1.03, duration: 2.6, ease: "power2.out" }, 0);
    tl.to("#c1", { x: -1100, filter: "blur(18px)", duration: .24, ease: "power3.in" }, 2.36);

    // 2. BACHATÓN : whip d'entrée, ralenti
    S("#c2", { x: 1100, scale: 1.14, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: .32, ease: "power3.out" }, 2.6);
    S("#c2", { scale: 1.14 }, { scale: 1.02, duration: 1.8, ease: "power2.out", immediateRender: false }, 2.75);
    S("#b1", { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: .3, ease: "expo.out" }, 2.75);
    // dip + flash chaud
    tl.to("#c2", { filter: "brightness(.55)", duration: .1 }, 4.5);
    S("#fuite", { opacity: 0 }, { opacity: 1, duration: .1, ease: "power2.in" }, 4.52);
    tl.to("#fuite", { opacity: 0, duration: .45, ease: "power2.out" }, 4.65);

    // 3. + SALSATÓN, 2 ambientes
    S("#c3", { scale: 1.2 }, { scale: 1.0, duration: 2.0, ease: "power2.out" }, 4.6);
    blurIn(["#c1t", "#c2t"], 4.7, .1);
    S("#cp", { opacity: 0, scaleX: .3 }, { opacity: 1, scaleX: 1, duration: .3, ease: "expo.out" }, 5.0);
    // zoom à travers
    tl.to("#c3", { scale: 2.2, filter: "blur(14px)", duration: .24, ease: "power3.in" }, 6.38);

    // 4. Le moment danse : on laisse respirer, juste « TERRASSA » discret
    S("#c4", { scale: 1.3, filter: "blur(14px)" }, { scale: 1.05, filter: "blur(0px)", duration: .4, ease: "expo.out" }, 6.6);
    S("#c4", { scale: 1.05 }, { scale: 1.0, duration: 2.3, ease: "none", immediateRender: false }, 7.0);
    S("#dm", { opacity: 0, letterSpacing: "24px" }, { opacity: .9, letterSpacing: "8px", duration: .6, ease: "expo.out" }, 7.3);
    tl.to("#c4", { y: -1920, filter: "blur(20px)", duration: .24, ease: "power3.in" }, 9.18);
    tl.to("#dm", { opacity: 0, duration: .15 }, 9.18);

    // 5. Nosotros te llevamos
    S("#c5", { y: 1920, filter: "blur(20px)" }, { y: 0, filter: "blur(0px)", duration: .32, ease: "power3.out" }, 9.4);
    S("#c5", { scale: 1.1 }, { scale: 1.0, duration: 2.0, ease: "power2.out" }, 9.4);
    blurIn(["#e1", "#e2"], 9.55, .12);
    S("#ep", { opacity: 0, scaleX: .3 }, { opacity: 1, scaleX: 1, duration: .3, ease: "expo.out" }, 9.95);

    // 6. Fin : cercle couleur vin, la plaque se pose, l'appel à l'action
    S("#fin", { clipPath: "circle(0% at 50% 55%)" }, { clipPath: "circle(120% at 50% 55%)", duration: .5, ease: "power2.inOut" }, 11.4);
    S("#c6", { scale: 1.25, filter: "blur(28px) brightness(.5)" }, { scale: 1.15, filter: "blur(28px) brightness(.5)", duration: 4.1, ease: "none" }, 11.4);
    S("#fin-plaque", { opacity: 0, scale: .82, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: .6, ease: "back.out(1.4)" }, 11.6);
    S("#fin-halo", { opacity: 0 }, { opacity: 1, duration: .8 }, 11.7);
    blurIn(["#f1", "#f2"], 11.95, .14);
    S("#ftr", { opacity: 0 }, { opacity: 1, duration: .25 }, 12.3);
    S("#fpx", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: .2 }, 12.45);
    S("#cta", { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .45, ease: "back.out(1.4)" }, 12.6);
    S("#slg", { opacity: 0 }, { opacity: 1, duration: .3 }, 12.9);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>

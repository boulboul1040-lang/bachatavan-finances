<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; }
  /* Palette chaude : vin, or, crème sur noir chaud. Plus de bleu/violet. */
  :root { --noir: #140A08; --vin: #8E1B2E; --vin-fonce: #4A0C16; --or: #F2B544; --or-clair: #FFE0A3; --creme: #FFF4E6; --braise: #FF7A3D; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--noir); }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--creme); }

  .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .cam video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

  /* lumière chaude + lisibilité */
  #chaleur { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(900px 700px at 30% 20%, rgba(255,150,60,.55), transparent 70%), radial-gradient(900px 900px at 80% 90%, rgba(142,27,46,.6), transparent 70%); }
  #voile { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(20,10,8,.55) 0%, rgba(20,10,8,0) 20%, rgba(20,10,8,0) 40%, rgba(20,10,8,.75) 72%, rgba(20,10,8,.9) 100%); }
  #fuite { position: absolute; inset: -200px; pointer-events: none; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(600px 900px at 85% 40%, rgba(255,140,50,.95), rgba(255,90,40,.4) 40%, transparent 70%); }

  /* logo plaque toujours visible (règle maison) */
  #logo { position: absolute; top: 300px; left: 0; right: 0; display: flex; justify-content: center; z-index: 20; }
  #logo img { width: 380px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)); }

  .t { position: absolute; left: 120px; right: 192px; text-align: center; z-index: 15; }
  .big { font-family: "Anton", sans-serif; line-height: .96; letter-spacing: 1px; }
  .w { display: inline-block; }
  .or { color: var(--or); }
  .ombre { text-shadow: 0 6px 30px rgba(20,10,8,.75); }
  .pill { display: inline-block; font-weight: 900; font-size: 34px; letter-spacing: 4px; color: var(--noir); background: var(--or); padding: 14px 30px; border-radius: 999px; }

  #h1-tag { top: 760px; }
  #h1 { top: 830px; font-size: 150px; }
  #h2 { top: 860px; font-size: 118px; }
  #h2-pill { top: 1110px; }
  #h4 { top: 900px; font-size: 128px; }
  #h5 { top: 820px; font-size: 176px; color: #FFF; text-shadow: 0 0 16px #FF6A3D, 0 0 44px #FF3D6A, 0 0 90px #8E1B2E; }
  #h5-sous { top: 1020px; font-weight: 900; font-size: 38px; letter-spacing: 6px; text-shadow: 0 0 14px rgba(255,106,61,.9); }
  #h6-pill { top: 860px; }
  #h6 { top: 940px; font-size: 190px; }

  /* carte chaude, caméra qui suit le van */
  #carte { position: absolute; inset: 0; background: radial-gradient(1000px 1100px at 50% 50%, #3A1810, var(--noir) 75%); overflow: hidden; z-index: 5; }
  #monde { position: absolute; left: 0; top: 0; width: 960px; height: 760px; transform-origin: 0 0; }
  #monde > svg { position: absolute; inset: 0; width: 960px; height: 760px; overflow: visible; }
  #van { position: absolute; left: 0; top: 0; width: 92px; height: 52px; margin: -26px 0 0 -46px; }
  #carte-titre { position: absolute; top: 470px; left: 0; right: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 84px; z-index: 6; text-shadow: 0 6px 24px rgba(0,0,0,.6); }
  #minutes { position: absolute; top: 572px; left: 0; right: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 96px; line-height: 1; color: var(--or); z-index: 6; text-shadow: 0 0 30px rgba(242,181,68,.45); }
  #minutes small { font-size: 36px; color: var(--creme); margin-left: 8px; }
  #pastille { position: absolute; left: 540px; top: 1110px; width: 560px; height: 76px; margin: -38px 0 0 -280px; border-radius: 999px; background: var(--or); z-index: 7; opacity: 0; }

  /* fin */
  #fin { position: absolute; inset: 0; background: radial-gradient(900px 1000px at 50% 45%, var(--vin), var(--vin-fonce) 70%, var(--noir)); z-index: 30; }
  #fin-halo { position: absolute; left: -100px; right: -100px; top: 520px; height: 420px; background: radial-gradient(ellipse, rgba(242,181,68,.45), rgba(242,181,68,0) 65%); }
  #fin-plaque { position: absolute; left: 120px; top: 620px; width: 840px; }
  #fin-plaque img { width: 840px; display: block; filter: drop-shadow(0 30px 50px rgba(0,0,0,.6)); }
  #fin-date { position: absolute; top: 850px; left: 0; right: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 92px; }
  #fin-trajet { position: absolute; top: 965px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 34px; color: var(--or-clair); }
  #fin-cta { position: absolute; top: 1050px; left: 0; right: 0; text-align: center; }
  #fin-cta span { display: inline-block; font-weight: 900; font-size: 42px; letter-spacing: 2px; color: var(--vin-fonce); background: var(--or); padding: 20px 44px; border-radius: 999px; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  #fin-slogan { position: absolute; top: 1170px; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 32px; }
  #fin-slogan em { font-style: normal; color: var(--or); }
</style>
</head>

  <script>
    const tl = gsap.timeline({ paused: true });
    const S = (sel, from, to, at) => tl.fromTo(sel, from, to, at);

    // ---------- 1. Accroche (complète dès l'image 0) : la caméra bouge, le titre reste immobile
    S("#c1", { scale: 1.18, x: 0 }, { scale: 1.04, duration: 1.75, ease: "power2.out" }, 0);
    S("#logo-img", { y: 0 }, { y: 0, duration: .01 }, 0);
    // Whip vers le plan 2 : flou horizontal au pic de vitesse
    tl.to("#c1", { x: -1100, filter: "blur(18px)", duration: .25, ease: "power3.in" }, 1.5);
    S("#c2", { x: 1100, scale: 1.12, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: .35, ease: "power3.out" }, 1.75);
    S("#c2", { scale: 1.12 }, { scale: 1.0, duration: 1.6, ease: "power2.out", immediateRender: false }, 1.9);

    // ---------- 2. Rendez-vous : mots qui sortent du flou, un par un
    ["#m1", "#m2", "#m3"].forEach((m, i) => S(m, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: .16, ease: "power2.out" }, 1.85 + i * .08));
    S("#pill-sf", { opacity: 0, scaleX: .3 }, { opacity: 1, scaleX: 1, duration: .3, ease: "expo.out" }, 2.15);
    // Transition « l'objet devient le monde » : la pastille dorée grandit et devient la carte
    tl.to("#h2", { opacity: 0, filter: "blur(10px)", duration: .18 }, 3.2);
    tl.to("#pill-sf", { scale: 9, duration: .3, ease: "power3.in" }, 3.2);
    tl.to("#c2", { filter: "blur(14px)", duration: .3 }, 3.2);

    // ---------- 3. Carte : la caméra suit le van puis recule pour montrer tout le trajet
    const route = document.getElementById("route"), L = route.getTotalLength(), van = document.getElementById("van"), monde = document.getElementById("monde"), minN = document.getElementById("min-n");
    const st = { p: 0, z: 2.1, f: 1 };
    const repos = { x: 60, y: 560, z: 1.0 }; // monde entier centré dans la bande sûre
    function cam() {
      const a = route.getPointAtLength(st.p * L), b = route.getPointAtLength(Math.min(L, st.p * L + 2));
      let ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; const flip = Math.abs(ang) > 90; if (flip) ang += 180;
      van.style.transform = `translate(${a.x}px, ${a.y}px) rotate(${ang}deg) scaleX(${flip ? -1 : 1})`;
      route.style.strokeDasharray = L; route.style.strokeDashoffset = L * (1 - st.p);
      const tx = 540 - a.x * st.z, ty = 860 - a.y * st.z;           // van au centre
      const x = tx * st.f + repos.x * (1 - st.f), y = ty * st.f + repos.y * (1 - st.f), z = st.z * st.f + repos.z * (1 - st.f);
      monde.style.transform = `translate(${x}px, ${y}px) scale(${z})`;
      minN.textContent = Math.round(st.p * 25);
    }
    cam();
    S("#carte", { opacity: 0 }, { opacity: 1, duration: .15 }, 3.42);
    tl.to(st, { p: 1, duration: 1.85, ease: "power2.inOut", onUpdate: cam }, 3.55);
    tl.to(st, { f: 0, duration: .9, ease: "power2.inOut", onUpdate: cam }, 4.55);
    ["#ct1", "#ct2", "#ct3"].forEach((m, i) => S(m, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: .16 }, 3.6 + i * .08));
    S("#pin", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: .45, ease: "back.out(1.4)" }, 5.25);
    S("#halo-acm", { opacity: 0 }, { opacity: 1, duration: .4 }, 5.3);
    tl.to("#van", { opacity: 0, duration: .12 }, 5.3);
    // Zoom à travers le pin vers le van
    tl.to(monde, { scale: 9, x: -2100, y: -400, duration: .3, ease: "power3.in", onStart: () => {} }, 5.85);
    tl.to(["#carte-titre", "#minutes"], { opacity: 0, filter: "blur(10px)", duration: .18 }, 5.85);

    // ---------- 4. Dans le van (son réel des passagers)
    S("#c4", { scale: 1.35, filter: "blur(16px)" }, { scale: 1.06, filter: "blur(0px)", duration: .4, ease: "expo.out" }, 6.1);
    S("#c4", { scale: 1.06 }, { scale: 1.0, duration: 1.7, ease: "none", immediateRender: false }, 6.5);
    S("#b1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: .2 }, 6.35);
    S("#b2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: .16 }, 6.5);
    S("#b3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: .16 }, 6.58);
    // Dip cut + éclat de lumière chaude
    tl.to("#c4", { filter: "brightness(.55)", duration: .1 }, 8.1);
    S("#fuite", { opacity: 0 }, { opacity: 1, duration: .1, ease: "power2.in" }, 8.12);
    tl.to("#fuite", { opacity: 0, duration: .5, ease: "power2.out" }, 8.25);

    // ---------- 5. ACM : ralenti, enseigne néon qui s'allume
    S("#c5", { scale: 1.2 }, { scale: 1.0, duration: 2.9, ease: "power2.out" }, 8.2);
    S("#neon", { opacity: 0 }, { opacity: 1, duration: .04 }, 8.45);
    tl.to("#neon", { opacity: .2, duration: .04, yoyo: true, repeat: 3 }, 8.52);
    S("#sous", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: .2 }, 8.9);
    tl.to("#c5", { y: -1920, filter: "blur(20px)", duration: .25, ease: "power3.in" }, 10.85);
    tl.to(["#neon", "#sous"], { y: -400, opacity: 0, duration: .2, ease: "power3.in" }, 10.85);

    // ---------- 6. Retour
    S("#c6", { y: 1920, filter: "blur(20px)" }, { y: 0, filter: "blur(0px)", duration: .35, ease: "power3.out" }, 11.1);
    S("#c6", { scale: 1.12 }, { scale: 1.0, duration: 1.7, ease: "power2.out" }, 11.1);
    S("#pill-r", { opacity: 0, scaleX: .3 }, { opacity: 1, scaleX: 1, duration: .3, ease: "expo.out" }, 11.3);
    ["#r1", "#r2", "#r3"].forEach((m, i) => S(m, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: .15 }, 11.45 + i * .07));

    // ---------- 7. Fin : inondation de couleur vin, la plaque se pose
    S("#fin", { clipPath: "circle(0% at 50% 55%)" }, { clipPath: "circle(120% at 50% 55%)", duration: .5, ease: "power2.inOut" }, 12.8);
    S("#fin-plaque", { opacity: 0, scale: .82, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: .6, ease: "back.out(1.4)" }, 13.0);
    S("#fin-halo", { opacity: 0 }, { opacity: 1, duration: .8 }, 13.1);
    S("#d1", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: .16 }, 13.35);
    S("#d2", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: .16 }, 13.45);
    S("#ftr", { opacity: 0 }, { opacity: 1, duration: .25 }, 13.6);
    S("#cta", { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .45, ease: "back.out(1.4)" }, 13.75);
    S("#slg", { opacity: 0 }, { opacity: 1, duration: .3 }, 14.0);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>

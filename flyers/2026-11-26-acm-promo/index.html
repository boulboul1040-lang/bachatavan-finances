<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; }
  :root { --nuit: #0E0A12; --or: #FFC24B; --or-clair: #FFE3A1; --passion: #E8304A; --creme: #FFF6EC; --neon: #FF4FD8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nuit); }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--creme); }

  video.plan { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  #fin-bg { filter: blur(26px) brightness(.45) saturate(1.2); transform: scale(1.15); }

  /* voiles pour lire le texte */
  #voile { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(14,10,18,.75) 0%, rgba(14,10,18,0) 22%, rgba(14,10,18,0) 52%, rgba(14,10,18,.85) 80%, rgba(14,10,18,.95) 100%); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #grain { position: absolute; inset: -50px; opacity: .09; pointer-events: none; mix-blend-mode: overlay; }
  #flash { position: absolute; inset: 0; background: #FFF6EC; opacity: 0; pointer-events: none; }

  /* logo fixe en haut */
  #logo { position: absolute; top: 186px; left: 0; right: 0; display: flex; justify-content: center; }
  #logo img { width: 420px; height: auto; filter: drop-shadow(0 10px 24px rgba(0,0,0,.7)); }

  /* textes */
  .t { position: absolute; left: 60px; right: 60px; text-align: center; }
  .big { font-family: "Anton", sans-serif; line-height: .95; letter-spacing: 1px; text-shadow: 0 8px 30px rgba(0,0,0,.6); }
  .big em { font-style: normal; background: linear-gradient(180deg, var(--or-clair), var(--or) 55%, #C98A1B); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 16px rgba(0,0,0,.85)); }
  .w { display: inline-block; }
  .pill { display: inline-block; font-weight: 900; font-size: 40px; letter-spacing: 3px; color: var(--nuit); background: var(--or); padding: 16px 34px; border-radius: 999px; box-shadow: 0 14px 30px rgba(0,0,0,.45); }
  .pill.rouge { background: var(--passion); color: var(--creme); }

  #t1 { top: 980px; font-size: 168px; }
  #t1-tag { top: 900px; }
  #t2 { top: 1100px; }
  #t2 .big { font-size: 96px; display: block; margin-bottom: 22px; }
  #t4 { top: 1060px; }
  #t4 .big { font-size: 120px; display: block; text-shadow: 0 6px 24px rgba(0,0,0,.9); }
  #t4::before { content: ""; position: absolute; left: -60px; right: -60px; top: -80px; bottom: -80px; background: radial-gradient(ellipse at center, rgba(14,10,18,.6), rgba(14,10,18,0) 70%); z-index: -1; }
  #t4 .barre { display: block; height: 10px; width: 520px; margin: 18px auto 0; border-radius: 6px; background: var(--or); transform-origin: left center; }
  #t5 { top: 860px; }
  #t5 .big { font-size: 190px; color: #fff; text-shadow: 0 0 18px #FF4FD8, 0 0 46px #FF4FD8, 0 0 90px #B21FFF; }
  #t5 .sous { display: block; margin-top: 20px; font-weight: 900; font-size: 44px; letter-spacing: 6px; color: var(--creme); text-shadow: 0 0 14px rgba(255,79,216,.9); }
  #t6 { top: 1060px; }
  #t6 .big { font-size: 120px; display: block; margin-top: 18px; }

  /* carte */
  #carte { position: absolute; inset: 0; background: radial-gradient(900px 900px at 50% 45%, #2A1A33, #0E0A12 75%); }
  #carte-in { position: absolute; left: 40px; top: 470px; width: 1000px; height: 792px; }
  #carte-in svg { position: absolute; inset: 0; width: 1000px; height: 792px; }
  #van { position: absolute; left: 0; top: 0; width: 110px; height: 62px; margin: -31px 0 0 -55px; }
  #van svg { width: 110px; height: 62px; }
  #carte-titre { position: absolute; top: 330px; left: 0; right: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 92px; }
  #carte-titre em { font-style: normal; color: var(--or); }
  #mins { position: absolute; top: 1200px; z-index: 2; text-shadow: 0 0 30px rgba(255,194,75,.5); left: 0; right: 0; text-align: center; font-family: "Anton", sans-serif; font-size: 150px; line-height: 1; color: var(--or); }
  #mins small { font-size: 54px; color: var(--creme); margin-left: 10px; }

  /* fin */
  #fin { position: absolute; inset: 0; }
  #fin-plaque { position: absolute; left: 90px; top: 640px; width: 900px; }
  #fin-plaque img { width: 900px; display: block; filter: drop-shadow(0 30px 50px rgba(0,0,0,.7)); }
  #fin-halo { position: absolute; left: -100px; right: -100px; top: 560px; height: 360px; background: radial-gradient(ellipse, rgba(255,194,75,.35), rgba(255,194,75,0) 65%); }
  #fin-txt { position: absolute; top: 900px; left: 60px; right: 60px; text-align: center; }
  #fin-date { font-family: "Anton", sans-serif; font-size: 86px; line-height: 1; }
  #fin-date em { font-style: normal; color: var(--or); }
  #fin-h { margin-top: 18px; font-weight: 800; font-size: 40px; color: var(--creme); opacity: .9; }
  #fin-cta { margin-top: 44px; }
  #fin-cta span { font-size: 46px; padding: 22px 46px; }
  #fin-slogan { margin-top: 36px; font-weight: 700; font-size: 34px; }
  #fin-slogan em { font-style: normal; color: var(--or); }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

    <!-- PLANS -->
    <video id="p1" class="plan clip" src="assets/sagrada.mp4" data-start="0" data-duration="1.8" data-media-start="4.4" data-track-index="0" muted></video>
    <video id="p2" class="plan clip" src="assets/sagrada.mp4" data-start="1.8" data-duration="1.8" data-media-start="0.4" data-track-index="1" muted></video>
    <div id="carte" class="clip" data-start="3.6" data-duration="2.6" data-track-index="2">
      <div id="carte-titre"><span id="ct">SAGRADA <em>→</em> ACM</span></div>
      <div id="carte-in">
        <svg viewBox="0 0 960 760" aria-hidden="true">
          <defs>
            <pattern id="grille" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="34" height="34" fill="none" stroke="#2C2233" stroke-width="2"/></pattern>
            <radialGradient id="halo"><stop offset="0" stop-color="#FFC24B" stop-opacity=".6"/><stop offset="1" stop-color="#FFC24B" stop-opacity="0"/></radialGradient>
          </defs>
          <path d="M960 380 C 900 470, 820 560, 760 640 S 700 720, 690 760 L 960 760 Z" fill="#14223A"/>
          <path d="M380 470 C 470 420, 640 400, 760 440 L 800 560 C 760 640, 640 700, 480 700 C 400 650, 360 560, 380 470 Z" fill="url(#grille)"/>
          <path d="M0 330 C 120 300, 230 380, 330 340 S 520 250, 640 300 S 820 250, 960 200 L 960 270 C 830 320, 720 360, 630 360 S 470 410, 340 420 S 120 400, 0 420 Z" fill="#1F2A1E"/>
          <path d="M150 80 C 230 60, 400 70, 450 120 C 470 190, 400 240, 300 240 C 200 240, 130 190, 150 80 Z" fill="url(#grille)" opacity=".7"/>
          <path d="M600 600 C 560 520, 600 450, 560 400 S 440 330, 400 280 S 330 210, 300 150" fill="none" stroke="#3A2A40" stroke-width="18" stroke-linecap="round"/>
          <path id="route" d="M600 600 C 560 520, 600 450, 560 400 S 440 330, 400 280 S 330 210, 300 150" fill="none" stroke="#FFC24B" stroke-width="10" stroke-linecap="round" style="filter: drop-shadow(0 0 12px #FFC24B)"/>
          <circle cx="600" cy="600" r="80" fill="url(#halo)"/>
          <g transform="translate(600 600)" fill="#FFF6EC"><path d="M-34 0 L-34 -38 L-30 -62 L-26 -38 L-26 0 Z"/><path d="M-18 0 L-18 -52 L-13 -84 L-8 -52 L-8 0 Z"/><path d="M-4 0 L-4 -66 L2 -104 L8 -66 L8 0 Z"/><path d="M12 0 L12 -52 L17 -84 L22 -52 L22 0 Z"/><path d="M28 0 L28 -38 L32 -62 L36 -38 L36 0 Z"/><rect x="-40" y="-8" width="82" height="12" rx="3"/></g>
          <g id="pin"><circle id="onde" cx="300" cy="150" r="30" fill="none" stroke="#FF4FD8" stroke-width="6"/>
            <path d="M300 150 C 278 120, 262 104, 262 84 A 38 38 0 0 1 338 84 C 338 104, 322 120, 300 150 Z" fill="#E8304A" stroke="#FFF6EC" stroke-width="4"/><circle cx="300" cy="84" r="14" fill="#FFF6EC"/></g>
        </svg>
        <div id="van"><svg viewBox="0 0 92 52" aria-hidden="true"><rect x="4" y="6" width="80" height="34" rx="9" fill="#FFF6EC" stroke="#8E1B2E" stroke-width="4"/><path d="M58 10 h14 a8 8 0 0 1 8 8 v8 h-22z" fill="#1F3FA8"/><rect x="14" y="13" width="36" height="9" rx="2" fill="#8E1B2E"/><circle cx="24" cy="42" r="8" fill="#0E0A12" stroke="#FFC24B" stroke-width="3"/><circle cx="66" cy="42" r="8" fill="#0E0A12" stroke="#FFC24B" stroke-width="3"/></svg></div>
      </div>
      <div id="mins"><span id="mins-n">0</span><small>MIN</small></div>
    </div>
    <video id="p4" class="plan clip" src="assets/van.mp4" data-start="6.2" data-duration="2" data-media-start="1.0" data-track-index="3" muted></video>
    <video id="p5" class="plan clip" src="assets/acm.mp4" data-start="8.2" data-duration="2.9" data-media-start="0.6" data-track-index="4" muted></video>
    <video id="p6" class="plan clip" src="assets/groupe-nuit.mp4" data-start="11.1" data-duration="1.6" data-media-start="4.0" data-track-index="5" muted></video>
    <video id="fin-bg" class="plan clip" src="assets/groupe-nuit.mp4" data-start="12.7" data-duration="2.3" data-media-start="5.6" data-track-index="6" muted></video>

    <div id="voile" class="clip" data-start="0" data-duration="15" data-track-index="7"></div>
    <div id="vignette" class="clip" data-start="0" data-duration="15" data-track-index="8"></div>

    <!-- TEXTES -->
    <div id="t1-tag" class="t clip" data-start="0" data-duration="1.8" data-track-index="9"><span class="pill">THURSDAY 26 NOV</span></div>
    <div id="t1" class="t big clip" data-start="0" data-duration="1.8" data-track-index="10"><span class="w" id="w1">YOUR</span> <span class="w" id="w2">RIDE</span><br><span class="w" id="w3">TO</span> <em class="w" id="w4">ACM</em></div>
    <div id="t2" class="t clip" data-start="1.8" data-duration="1.8" data-track-index="11"><span class="big" id="t2a">MEET AT <em>22:30</em></span><span class="pill" id="t2b">SAGRADA FAMÍLIA</span></div>
    <div id="t4" class="t clip" data-start="6.2" data-duration="2" data-track-index="12"><span class="big" id="t4a">BACHATA<br><em>ON BOARD</em></span><span class="barre" id="t4b"></span></div>
    <div id="t5" class="t clip" data-start="8.2" data-duration="2.9" data-track-index="13"><span class="big" id="t5a">ACM CITY</span><span class="sous" id="t5b">ROOM 1 · 100% BACHATA</span></div>
    <div id="t6" class="t clip" data-start="11.1" data-duration="1.6" data-track-index="14"><span class="pill rouge" id="t6a">RIDE HOME</span><span class="big" id="t6b">02:30</span></div>

    <!-- FIN -->
    <div id="fin" class="clip" data-start="12.7" data-duration="2.3" data-track-index="15">
      <div id="fin-halo"></div>
      <div id="fin-plaque"><img src="assets/plaque.png" alt="BachataVan" /></div>
      <div id="fin-txt">
        <div id="fin-date">THURSDAY <em>26 NOV</em></div>
        <div id="fin-h">22:30 Sagrada Família → ACM City · back 02:30</div>
        <div id="fin-cta"><span class="pill rouge">BOOK YOUR SEAT · LINK IN BIO</span></div>
        <div id="fin-slogan">More than a ride. <em>It's a community.</em></div>
      </div>
    </div>

    <div id="logo" class="clip" data-start="0" data-duration="12.7" data-track-index="16"><img src="assets/plaque.png" alt="BachataVan" /></div>

    <svg id="grain" class="clip" data-start="0" data-duration="15" data-track-index="17" width="1180" height="2020" aria-hidden="true">
      <filter id="bruit"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter>
      <rect width="100%" height="100%" filter="url(#bruit)"/>
    </svg>
    <div id="flash" class="clip" data-start="0" data-duration="15" data-track-index="18"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const coupes = [1.8, 3.6, 6.2, 8.2, 11.1, 12.7];
    // Flash + punch-in à chaque coupe
    coupes.forEach(t => {
      tl.fromTo("#flash", { opacity: .55 }, { opacity: 0, duration: .22, ease: "power2.out", immediateRender: false }, t);
    });
    const punch = (sel, t, d) => tl.fromTo(sel, { scale: 1.14 }, { scale: 1, duration: d, ease: "power3.out" }, t);
    punch("#p1", 0, 1.8); punch("#p2", 1.8, 1.8); punch("#p4", 6.2, 2); punch("#p5", 8.2, 2.9); punch("#p6", 11.1, 1.6);
    tl.fromTo("#grain", { x: 0, y: 0 }, { x: -40, y: -30, duration: 15, ease: "steps(90)" }, 0);
    tl.fromTo("#logo img", { y: -10 }, { y: 0, duration: .4, ease: "power3.out" }, 0);

    // 1. accroche (visible dès l'image 0)
    tl.fromTo("#t1-tag .pill", { scale: .9 }, { scale: 1, duration: .3, ease: "back.out(2.5)" }, 0);
    ["#w1", "#w2", "#w3", "#w4"].forEach((w, i) => tl.fromTo(w, { scale: 1.18, opacity: 1 }, { scale: 1, opacity: 1, duration: .3, ease: "power4.out", immediateRender: false }, .25 + i * .08));
    tl.to("#w4", { scale: 1.08, duration: .18, yoyo: true, repeat: 1, ease: "power2.inOut" }, .9);

    // 2. rendez-vous
    tl.fromTo("#t2a", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: .35, ease: "power3.out" }, 1.85);
    tl.fromTo("#t2b", { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .3, ease: "back.out(2.5)" }, 2.15);

    // 3. carte : le van roule
    const route = document.getElementById("route"), L = route.getTotalLength(), van = document.getElementById("van"), mn = document.getElementById("mins-n");
    const tr = { p: 0 };
    function place() {
      const a = route.getPointAtLength(tr.p * L), b = route.getPointAtLength(Math.min(L, tr.p * L + 2));
      let ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; const flip = Math.abs(ang) > 90; if (flip) ang += 180;
      const k = 1000 / 960;
      van.style.transform = `translate(${a.x * k}px, ${a.y * k}px) rotate(${ang}deg) scaleX(${flip ? -1 : 1})`;
      route.style.strokeDasharray = L; route.style.strokeDashoffset = L * (1 - tr.p); mn.textContent = Math.round(tr.p * 25);
    }
    place();
    tl.fromTo("#carte-in", { scale: 1.25, rotation: -4 }, { scale: 1, rotation: 0, duration: 2.6, ease: "power2.out" }, 3.6);
    tl.fromTo("#ct", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: .35, ease: "power3.out" }, 3.65);
    tl.to(tr, { p: 1, duration: 1.8, ease: "power2.inOut", onUpdate: place }, 3.75);
    tl.fromTo("#pin", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: .35, ease: "bounce.out" }, 5.5);
    tl.to("#van", { opacity: 0, duration: .15 }, 5.5);
    tl.fromTo("#onde", { attr: { r: 20 }, opacity: 1 }, { attr: { r: 110 }, opacity: 0, duration: .6, ease: "power2.out" }, 5.6);
    tl.fromTo("#mins", { scale: 1 }, { scale: 1.15, duration: .15, yoyo: true, repeat: 1 }, 5.5);

    // 4. dans le van
    tl.fromTo("#t4a", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: .35, ease: "power3.out" }, 6.3);
    tl.fromTo("#t4b", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power3.out" }, 6.55);

    // 5. ACM néon (clignote comme une enseigne)
    tl.fromTo("#t5a", { opacity: 0, scale: .92 }, { opacity: 1, scale: 1, duration: .08 }, 8.3);
    tl.to("#t5a", { opacity: .25, duration: .05, yoyo: true, repeat: 3 }, 8.4);
    tl.fromTo("#t5a", { scale: 1 }, { scale: 1.06, duration: 2.6, ease: "none" }, 8.5);
    tl.fromTo("#t5b", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .35, ease: "power3.out" }, 8.8);

    // 6. retour
    tl.fromTo("#t6a", { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .3, ease: "back.out(2.5)" }, 11.15);
    tl.fromTo("#t6b", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: .35, ease: "power3.out" }, 11.35);

    // 7. fin
    tl.fromTo("#fin-plaque", { scale: .85, opacity: 0, rotationX: 25 }, { scale: 1, opacity: 1, rotationX: 0, duration: .55, ease: "back.out(1.6)" }, 12.75);
    tl.fromTo("#fin-halo", { opacity: 0 }, { opacity: 1, duration: .6 }, 12.9);
    tl.fromTo("#fin-date", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .35, ease: "power3.out" }, 13.05);
    tl.fromTo("#fin-h", { y: 30, opacity: 0 }, { y: 0, opacity: .9, duration: .35, ease: "power3.out" }, 13.25);
    tl.fromTo("#fin-cta span", { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: "back.out(2.4)" }, 13.45);
    tl.to("#fin-cta span", { scale: 1.06, duration: .22, yoyo: true, repeat: 3, ease: "power2.inOut" }, 14.0);
    tl.fromTo("#fin-slogan", { opacity: 0 }, { opacity: 1, duration: .4 }, 13.7);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; }
  :root { --nuit: #0E0A12; --or: #FFC24B; --passion: #E8304A; --creme: #FFF6EC; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nuit); }
  #van { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  #van-voile { position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(14,10,18,.55) 0%, rgba(14,10,18,0) 22%, rgba(14,10,18,0) 55%, rgba(14,10,18,.7) 100%); }
  #van-tag { position: absolute; top: 220px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; }
  #van-tag span { font-family: "Inter", sans-serif; font-weight: 900; font-size: 30px; letter-spacing: 6px; color: var(--nuit); background: var(--or); padding: 12px 30px; border-radius: 999px; }
  .van-titre { position: absolute; left: 0; right: 0; top: 1310px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .van-titre span { font-family: "Anton", sans-serif; font-size: 104px; line-height: 1; text-transform: uppercase; color: var(--creme); background: var(--nuit); padding: 10px 28px 16px; border-radius: 16px; }
  .van-titre span.chaud { background: var(--passion); }
  #flash { position: absolute; inset: 0; z-index: 5; background: var(--creme); opacity: 0; }
  #pizza { z-index: 3; }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="12.6" data-width="1080" data-height="1920">
    <!-- Scène 1 : le van (son du van sur tout le film) -->
    <video id="van" class="clip" src="assets/van.mp4" data-start="0" data-duration="7" data-media-start="0.5" data-track-index="0" muted></video>
    <audio id="son-van" src="assets/van-son.m4a" data-start="0" data-duration="11.5" data-media-start="0.5" data-fade-out="1.5" data-track-index="9"></audio>
    <div id="van-voile" class="clip" data-start="0" data-duration="7" data-track-index="1"></div>
    <div id="van-tag" class="clip" data-start="0" data-duration="7" data-track-index="2"><span id="van-tag-txt">LAST NIGHT · AFTER ACM</span></div>
    <div id="titre-1" class="van-titre clip" data-start="0.2" data-duration="3.4" data-track-index="3"><span id="t1a">The ride home</span><span id="t1b" class="chaud">is the afterparty</span></div>
    <div id="titre-2" class="van-titre clip" data-start="3.9" data-duration="3.1" data-track-index="3"><span id="t2a">Still hungry?</span><span id="t2b" class="chaud">Next stop…</span></div>

    <!-- Scène 2 : la pizza + BachataVan -->
    <div id="pizza" data-composition-id="pizza" data-composition-src="compositions/pizza.html" data-start="7" data-duration="5.6" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    <div id="flash" class="clip" data-start="6.85" data-duration="0.45" data-track-index="5"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#van-tag-txt", { y: -20 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);
    tl.fromTo("#t1a", { opacity: 0, y: 40, rotation: -3 }, { opacity: 1, y: 0, rotation: -2, duration: 0.3, ease: "back.out(2)" }, 0.2);
    tl.fromTo("#t1b", { opacity: 0, y: 40, rotation: 3 }, { opacity: 1, y: 0, rotation: 1.5, duration: 0.3, ease: "back.out(2)" }, 0.55);
    tl.to("#titre-1", { opacity: 0, y: -30, duration: 0.2, ease: "power2.in" }, 3.38);
    tl.fromTo("#t2a", { opacity: 0, y: 40, rotation: 3 }, { opacity: 1, y: 0, rotation: 2, duration: 0.3, ease: "back.out(2)" }, 3.9);
    tl.fromTo("#t2b", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, 4.5);
    tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.in" }, 6.85);
    tl.to("#flash", { opacity: 0, duration: 0.28, ease: "power2.out" }, 7.0);
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>

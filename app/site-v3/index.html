<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BachataVan BCN</title>
<meta name="description" content="Tú baila, nosotros conducimos. Cada semana desde la Sagrada Família a las mejores noches de bachata de Barcelona, ida y vuelta por 15 €.">
<meta property="og:title" content="BachataVan BCN · Tú baila, nosotros conducimos">
<meta property="og:description" content="Desde la Sagrada Família a la pista, ida y vuelta. Reserva tu plaza por WhatsApp.">
<meta property="og:image" content="/img/hero.jpg">
<meta name="theme-color" content="#0F0907">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BachataVan">
<style>
/* ------------------------------------------------------------------
   Concept: the departures board of a night bus station.
   BachataVan is transport + nightlife, so the page is built from the
   vernacular of travel: a licence plate as the logo, a split-flap
   SALIDAS board as the heart of the page, a WhatsApp ticket flow,
   a punch card, and the chamfered Eixample grid for the meeting point.
   Palette: warm night (no blue/violet), plate cream + wine + EU blue,
   gold for light. Fonts are self-hosted so they render everywhere.
   ------------------------------------------------------------------ */
@font-face { font-family: "BV Display"; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "BV Display"; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "BV Display"; src: url("fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "BV Text"; src: url("fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "BV Text"; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "BV Text"; src: url("fonts/inter-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "BV Mono"; src: url("fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }

:root {
  --night: #0F0907; --panel: #18100C; --tile: #221813; --tile-hi: #2C2019; --seam: #0A0604; --rule: #33241B;
  --cream: #FFF2E2; --muted: #B9A493; --faint: #7D6A5C;
  --plate: #F8F6F1; --wine: #8E1B2E; --eu: #1F3FA8; --gold: #F2B544; --gold-hi: #FFD989;
  --open: #8FD9A0; --low: #F2B544; --full: #EE5A6E;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { background: var(--night); color: var(--cream); font-family: "BV Text", -apple-system, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.display { font-family: "BV Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; text-transform: uppercase; }
.mono { font-family: "BV Mono", ui-monospace, "SF Mono", Menlo, monospace; }
.label { font-family: "BV Mono", ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* ---------- top bar ---------- */
.top { position: absolute; inset: 0 0 auto 0; z-index: 5; padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; padding-block: 14px; }
.plate { display: block; height: 30px; width: auto; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
.langs { display: flex; gap: 2px; background: rgba(15,9,7,.55); border: 1px solid rgba(255,242,226,.14); border-radius: 999px; padding: 3px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.langs button { border: 0; background: transparent; border-radius: 999px; padding: 6px 11px; min-height: 32px; font-family: "BV Mono", Menlo, monospace; font-size: 12px; letter-spacing: .08em; color: var(--muted); cursor: pointer; transition: background-color 200ms ease, color 200ms ease; }
.langs button.on { background: var(--cream); color: var(--night); }

/* ---------- hero ---------- */
.hero { position: relative; min-height: 560px; display: flex; align-items: flex-end; overflow: hidden; }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
.hero::after { content: ""; position: absolute; inset: 0; background:
  linear-gradient(180deg, rgba(15,9,7,.55) 0%, rgba(15,9,7,.05) 26%, rgba(15,9,7,.25) 52%, rgba(15,9,7,.92) 84%, var(--night) 100%),
  radial-gradient(70% 50% at 85% 20%, rgba(242,181,68,.18), transparent 70%); }
.hero .wrap { position: relative; z-index: 2; padding-block: 140px 132px; }
.kicker { display: inline-flex; align-items: center; gap: 8px; color: var(--cream); background: rgba(15,9,7,.62); border: 1px solid rgba(255,242,226,.14); border-radius: 999px; padding: 6px 12px 6px 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.kicker i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(242,181,68,.18); }
h1 { font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(54px, 16vw, 104px); line-height: .86; letter-spacing: -.005em; margin-top: 14px; }
h1 span { display: block; }
h1 .g { color: var(--gold); }
.lede { margin-top: 16px; max-width: 30ch; font-size: 17px; color: rgba(255,242,226,.86); }

/* ---------- departures board ---------- */
.board { position: relative; z-index: 3; margin-top: -104px; background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,242,226,.05); overflow: hidden; }
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 16px 14px; border-bottom: 1px solid var(--rule); }
.board-title { font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-weight: 800; text-transform: uppercase; font-size: 26px; line-height: 1; letter-spacing: .02em; }
.board-title small { display: block; margin-top: 4px; }
.clock { text-align: right; }
.clock b { display: block; font-family: "BV Mono", Menlo, monospace; font-size: 22px; letter-spacing: .04em; color: var(--gold); font-variant-numeric: tabular-nums; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--open); }
.cols { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; padding: 10px 16px 6px; }
.row { border-top: 1px solid var(--rule); }
.row:first-of-type { border-top: 0; }
.row-main { width: 100%; text-align: left; background: transparent; border: 0; cursor: pointer; display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; }
.when .d { font-family: "BV Mono", Menlo, monospace; font-size: 12px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.when .n { font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-weight: 700; font-size: 26px; line-height: 1; }
.flaps { display: flex; gap: 3px; }
.flap { position: relative; width: 22px; height: 32px; border-radius: 4px; background: linear-gradient(180deg, var(--tile-hi) 0 50%, var(--tile) 50% 100%); box-shadow: inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 0 rgba(255,242,226,.04);
  display: grid; place-items: center; font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-weight: 700; font-size: 22px; line-height: 1; color: var(--cream); overflow: hidden; }
.flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--seam); }
.flap.sep { width: 10px; background: none; box-shadow: none; color: var(--faint); }
.flap.sep::after { display: none; }
.flap.tick { animation: tick 70ms linear; }
@keyframes tick { 0% { transform: scaleY(.82); filter: brightness(1.35); } 100% { transform: none; } }
.dest { min-width: 0; }
.dest .name { font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-weight: 700; text-transform: uppercase; font-size: 22px; line-height: 1.05; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.dest .name i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); flex: none; }
.dest .town { font-size: 13px; color: var(--muted); margin-top: 2px; }
.status { font-family: "BV Mono", Menlo, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap; }
.status.open { color: var(--open); } .status.low { color: var(--low); } .status.full { color: var(--full); }
.row-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 300ms var(--ease-out); }
.row.open .row-more { grid-template-rows: 1fr; }
.row-more > div { overflow: hidden; }
.ticket { margin: 0 16px 16px; border-radius: 14px; background: var(--plate); color: #1A110C; display: grid; grid-template-columns: 1fr; position: relative; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 96px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); }
.ticket::before { left: -8px; } .ticket::after { right: -8px; }
.leg { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; padding: 16px 16px 14px; }
.leg .t { font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-weight: 800; font-size: 34px; line-height: .9; }
.leg .p { font-size: 12px; color: #6B5A4D; margin-top: 4px; }
.leg .r { text-align: right; }
.leg .mid { font-family: "BV Mono", Menlo, monospace; font-size: 11px; color: #6B5A4D; text-align: center; padding-bottom: 6px; }
.leg .mid svg { display: block; margin: 0 auto 4px; }
.perf { border-top: 2px dashed #D9CFC3; margin: 0 16px; }
.buy { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px 16px; flex-wrap: wrap; }
.price b { font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-weight: 800; font-size: 32px; line-height: 1; color: var(--wine); }
.price s { color: #9A8A7D; margin-left: 6px; }
.price span { display: block; font-size: 12px; color: #6B5A4D; }
.go { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; background: var(--wine); color: var(--plate); font-weight: 800; text-decoration: none; transition: transform 160ms var(--ease-out), background-color 200ms ease; }
.go:active { transform: scale(0.97); }
.go.wait { background: #1A110C; }
.board-foot { padding: 12px 16px 14px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.eb { display: inline-flex; align-items: center; gap: 8px; color: var(--gold); font-size: 13px; font-weight: 600; }
.eb b { font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-size: 18px; }
.preview { font-size: 12px; color: var(--low); }
.empty { padding: 22px 16px; color: var(--muted); }

/* ---------- sections ---------- */
section.block { padding-block: 72px 0; }
.sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
.sec-head .num { color: var(--gold); }
h2 { font-family: "BV Display", "Arial Narrow", Arial, sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(36px, 10vw, 56px); line-height: .9; letter-spacing: -.005em; }
h2 em { font-style: normal; color: var(--gold); }
.sub { color: var(--muted); max-width: 46ch; margin-top: 10px; }

/* WhatsApp flow */
.flow { display: grid; grid-template-columns: 1fr; gap: 26px; align-items: start; }
.phone { background: #0B141A; border-radius: 28px; padding: 14px 12px 18px; border: 1px solid #22303A; box-shadow: 0 30px 60px -30px rgba(0,0,0,.9); max-width: 360px; width: 100%; margin: 0 auto; }
.phone-top { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; border-bottom: 1px solid #1C2A33; }
.phone-top .av { width: 34px; height: 34px; border-radius: 50%; background: var(--wine); display: grid; place-items: center; font-family: "BV Display", Arial, sans-serif; font-weight: 800; color: var(--gold); font-size: 15px; }
.phone-top b { display: block; font-size: 14px; color: #E9EDEF; }
.phone-top span { font-size: 11px; color: #8696A0; }
.chat { display: grid; gap: 8px; padding: 14px 4px 0; }
.msg { max-width: 84%; padding: 8px 10px 6px; border-radius: 10px; font-size: 13.5px; line-height: 1.35; color: #E9EDEF; position: relative; }
.msg small { display: block; text-align: right; font-size: 10px; color: #8696A0; margin-top: 2px; }
.msg.me { justify-self: end; background: #005C4B; border-top-right-radius: 2px; }
.msg.bot { justify-self: start; background: #202C33; border-top-left-radius: 2px; }
.msg .pay { display: block; margin-top: 6px; padding: 8px; border-radius: 8px; background: #11181D; color: #53BDEB; font-weight: 600; }
.msg .ok { color: var(--open); font-weight: 600; }
.steps { display: grid; gap: 18px; counter-reset: s; }
.step { display: grid; grid-template-columns: 44px 1fr; gap: 14px; }
.step .k { font-family: "BV Display", Arial, sans-serif; font-weight: 800; font-size: 40px; line-height: .9; color: var(--gold); }
.step b { display: block; font-size: 17px; }
.step p { color: var(--muted); font-size: 15px; margin-top: 2px; }
.js .flow .msg { opacity: 1; }
.flow.play .msg { animation: pop 360ms var(--ease-out) both; }
.flow.play .msg:nth-child(2) { animation-delay: 500ms; } .flow.play .msg:nth-child(3) { animation-delay: 1000ms; } .flow.play .msg:nth-child(4) { animation-delay: 1500ms; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.97); } }

/* punch card */
.punch { position: relative; background: var(--plate); color: #1A110C; border-radius: 16px; border: 6px solid var(--wine); padding: 16px 14px 16px 72px; max-width: 520px; overflow: hidden; }
.punch .eu { position: absolute; inset: 0 auto 0 0; width: 60px; background: var(--eu); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 14px 0 12px; }
.punch .eu b { font-family: "BV Display", Arial, sans-serif; font-weight: 800; color: var(--plate); font-size: 18px; }
.punch .t { font-family: "BV Display", Arial, sans-serif; font-weight: 800; text-transform: uppercase; color: var(--wine); font-size: 26px; line-height: 1; }
.punch .d { font-size: 13px; color: #6B5A4D; margin-top: 4px; }
.holes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 14px; max-width: 300px; }
.hole { aspect-ratio: 1; border-radius: 50%; border: 2px dashed #CDBFB1; display: grid; place-items: center; font-family: "BV Mono", Menlo, monospace; font-size: 11px; color: #9A8A7D; }
.hole.on { border: 2px solid var(--wine); background: radial-gradient(circle, var(--night) 0 38%, transparent 40%); color: transparent; }
.hole.free { border: 2px solid var(--gold); background: var(--gold); color: #1A110C; font-family: "BV Display", Arial, sans-serif; font-weight: 800; font-size: 15px; }

/* family mosaic */
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mosaic figure { position: relative; border-radius: 14px; overflow: hidden; background: var(--panel); }
.mosaic figure.tall { grid-row: span 2; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 4 / 5; }
.mosaic figure.tall img { aspect-ratio: auto; height: 100%; }
.mosaic figcaption { position: absolute; left: 10px; bottom: 10px; right: 10px; font-family: "BV Mono", Menlo, monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--cream); text-shadow: 0 1px 8px rgba(0,0,0,.8); }

/* meeting point */
.meet { display: grid; gap: 16px; }
.map { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--rule); background: #140D0A; }
.map svg { display: block; width: 100%; height: auto; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fact { border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
.fact b { display: block; font-family: "BV Display", Arial, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.1; text-transform: uppercase; }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 600; text-decoration: none; min-height: 44px; }

/* contact */
.contact { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding-block: 22px; display: grid; gap: 12px; }
.contact .num { font-family: "BV Display", Arial, sans-serif; font-weight: 700; font-size: 34px; letter-spacing: .02em; user-select: all; }
.services { display: flex; flex-wrap: wrap; gap: 6px; }
.services span { font-family: "BV Mono", Menlo, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 10px; color: var(--muted); }

.install { display: none; align-items: center; gap: 12px; margin-top: 18px; padding: 12px; border: 1px dashed var(--rule); border-radius: 14px; }
.install.show { display: flex; }
.install img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
.install p { font-size: 13px; color: var(--muted); }
.install b { color: var(--cream); }

footer { padding-block: 64px calc(48px + env(safe-area-inset-bottom, 0px)); text-align: center; }
footer svg { width: min(320px, 80%); height: auto; margin: 0 auto 18px; }
footer .slogan { font-family: "BV Display", Arial, sans-serif; font-weight: 800; text-transform: uppercase; font-size: 26px; line-height: 1; }
footer .slogan em { font-style: normal; color: var(--gold); }
footer .small { margin-top: 12px; font-size: 13px; color: var(--faint); }

@media (min-width: 720px) {
  .flow { grid-template-columns: 1fr 1fr; gap: 40px; }
  .meet { grid-template-columns: 1.3fr 1fr; align-items: start; }
  .hero { min-height: 640px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .flap.tick, .flow.play .msg { animation: none; }
  .row-more { transition: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="plate" viewBox="0 0 560 120">
    <rect x="4" y="4" width="552" height="112" rx="12" fill="#F8F6F1" stroke="#8E1B2E" stroke-width="7"/>
    <path d="M12 12 h56 v96 h-56 a6 6 0 0 1 -6 -6 v-84 a6 6 0 0 1 6 -6z" fill="#1F3FA8"/>
    <g fill="#F2B544"><circle cx="40" cy="22" r="2.6"/><circle cx="48.5" cy="24.3" r="2.6"/><circle cx="54.7" cy="30.5" r="2.6"/><circle cx="57" cy="39" r="2.6"/><circle cx="54.7" cy="47.5" r="2.6"/><circle cx="48.5" cy="53.7" r="2.6"/><circle cx="40" cy="56" r="2.6"/><circle cx="31.5" cy="53.7" r="2.6"/><circle cx="25.3" cy="47.5" r="2.6"/><circle cx="23" cy="39" r="2.6"/><circle cx="25.3" cy="30.5" r="2.6"/><circle cx="31.5" cy="24.3" r="2.6"/></g>
    <text x="40" y="96" text-anchor="middle" font-family="BV Display, Arial Narrow, Arial, sans-serif" font-weight="800" font-size="30" fill="#F8F6F1">BCN</text>
    <text x="312" y="88" text-anchor="middle" font-family="BV Display, Arial Narrow, Arial, sans-serif" font-weight="700" font-size="80" letter-spacing="6" fill="#8E1B2E">BACHATAVAN</text>
  </symbol>
</svg>

<div class="top"><div class="wrap">
  <svg class="plate" viewBox="0 0 560 120" role="img" aria-label="BachataVan"><use href="#plate"/></svg>
  <div class="langs" role="group" aria-label="Language"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button><button type="button" data-l="fr">FR</button></div>
</div></div>

<header class="hero">
  <img src="img/hero.jpg" alt="The BachataVan family posing in front of the van at night" fetchpriority="high">
  <div class="wrap">
    <div class="kicker label"><i></i><span data-t="kicker"></span></div>
    <h1><span data-t="h1a"></span><span class="g" data-t="h1b"></span></h1>
    <p class="lede" data-t="lede"></p>
  </div>
</header>

<main class="wrap">
  <!-- 01 · Departures -->
  <div class="board" id="salidas">
    <div class="board-head">
      <div class="board-title"><span data-t="board"></span><small class="label" data-t="boardSub"></small></div>
      <div class="clock"><b id="clock">--:--</b><span class="label live"><i></i><span data-t="live"></span></span></div>
    </div>
    <div class="cols label" aria-hidden="true"><span data-t="colDay"></span><span data-t="colDest"></span><span data-t="colSeats"></span></div>
    <div id="rows"><div class="empty" data-t="loading"></div></div>
    <div class="board-foot"><span class="eb" id="eb" hidden><b>10 €</b><span data-t="eb"></span></span><span class="preview" id="preview" hidden data-t="preview"></span></div>
  </div>

  <!-- 02 · How it works -->
  <section class="block" aria-labelledby="h-how">
    <div class="sec-head"><span class="label num">02</span><span class="label" data-t="howK"></span></div>

  out += '<g transform="translate(180 132)" fill="#FFF2E2"><path d="M-17 0 L-17 -19 L-15 -31 L-13 -19 L-13 0 Z"/><path d="M-9 0 L-9 -26 L-6.5 -42 L-4 -26 L-4 0 Z"/><path d="M-2 0 L-2 -33 L1 -52 L4 -33 L4 0 Z"/><path d="M6 0 L6 -26 L8.5 -42 L11 -26 L11 0 Z"/><path d="M14 0 L14 -19 L16 -31 L18 -19 L18 0 Z"/><rect x="-20" y="-4" width="41" height="6" rx="1.5"/></g>';
  out += '<g transform="translate(232 170)"><rect x="-4" y="-4" width="88" height="30" rx="6" fill="#F8F6F1" stroke="#8E1B2E" stroke-width="2"/><text x="40" y="16" text-anchor="middle" font-family="BV Mono, Menlo, monospace" font-size="10" fill="#1A110C">VAN · 22:25</text></g>';
  svg.innerHTML = out;
})();

renderText(); renderRows();
fetch(CSV + "&t=" + Date.now()).then(r => { if (!r.ok) throw 0; return r.text(); }).then(txt => {
  const rows = parseCSV(txt), h = rows.shift().map(x => x.trim().toLowerCase()), ix = n => h.findIndex(x => x == n);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  DATA = rows.filter(r => r.length > 3 && (r[ix("active")] || "").trim().toLowerCase() == "yes").map(r => {
    const link = (r[ix("link")] || "").trim();
    const s = { party: (r[ix("party")] || "").trim(), day: (r[ix("day")] || "").trim(), time: (r[ix("time")] || "").trim(), date: parseDate(r[ix("date soirée")] || ""), free: parseInt(r[ix("places libres")] || "0", 10) || 0 };
    s.link = link ? (link.startsWith("http") ? link : "https://" + link) : waLink(s);
    return s;
  }).filter(s => !s.date || s.date >= today).sort((a, b) => (a.date || 0) - (b.date || 0));
  renderRows();
}).catch(() => {
  if (/bachatavan\.com$|vercel\.app$/.test(location.hostname)) ERR = true; else { DATA = EXAMPLE; PREVIEW = true; }
  renderRows();
});

// Chat plays once when it scrolls into view; it is fully visible without this.
try { const fo = new IntersectionObserver(es => { if (es[0].isIntersecting) { $("flow").classList.add("play"); fo.disconnect(); } }, { threshold: .4 }); fo.observe($("flow")); } catch (e) {}
// "Add to home screen" on iPhone Safari, hidden once installed
try { const sa = matchMedia("(display-mode: standalone)").matches || navigator.standalone; if (!sa && /iphone|ipad/i.test(navigator.userAgent)) $("install").classList.add("show"); } catch (e) {}
